[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"  # Changed from 18 to 22

# Headers for correct MIME types
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# SPA Routing - Important: This should be LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200